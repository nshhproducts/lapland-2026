<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lapland 2026">
<meta name="theme-color" content="#0b1a30">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lapland 2026</title>
<style>
  :root{--bg:#0b1a30;--card:rgba(255,255,255,.07);--ink:#fff7ea;--muted:#9fb3cc;--gold:#ffd28a;--mint:#8ef0c9;--pink:#ff9ec6;--sky:#7fd4ff;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom));background:
    radial-gradient(900px 420px at 20% -10%,rgba(142,240,201,.28),transparent 60%),
    radial-gradient(800px 400px at 90% 0%,rgba(255,158,198,.22),transparent 60%),
    radial-gradient(700px 500px at 50% 110%,rgba(127,212,255,.18),transparent 60%),var(--bg)}
  .aurora{position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;filter:blur(40px);opacity:.55;background:linear-gradient(100deg,rgba(142,240,201,.0) 0%,rgba(142,240,201,.6) 30%,rgba(127,212,255,.5) 55%,rgba(255,158,198,.45) 80%,rgba(255,158,198,0) 100%);animation:aurora 14s ease-in-out infinite alternate}
  @keyframes aurora{from{transform:translateX(-6%) skewY(-4deg)}to{transform:translateX(6%) skewY(3deg)}}
  .snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .snow i{position:absolute;top:-10px;color:#fff;opacity:.5;font-style:normal;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
  header{text-align:center;padding:calc(30px + env(safe-area-inset-top)) 0 6px}
  header .big{font-size:52px;line-height:1}
  header h1{font-size:30px;font-weight:800;letter-spacing:.5px;margin-top:6px}
  header p{color:var(--muted);font-size:14px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;backdrop-filter:blur(6px)}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:12px;font-weight:700}
  .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .cd div{background:rgba(0,0,0,.25);border-radius:16px;padding:14px 4px}
  .cd b{display:block;font-size:34px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .cd-sub{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
  .wx{display:flex;align-items:center;gap:16px}
  .wx .ic{font-size:56px;line-height:1}
  .wx .t{font-size:48px;font-weight:800}
  .wx .d{color:var(--muted);font-size:14px}
  .wxrow{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  .wxrow::-webkit-scrollbar{display:none}
  .wxrow div{min-width:68px;flex:1;text-align:center;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 4px;font-size:12px;color:var(--muted);border:1px solid transparent}
  .wxrow div.trip{border-color:var(--gold)}
  .wxrow div span{display:block;font-size:24px;margin:4px 0}
  .wxrow div b{color:var(--ink);font-size:14px}
  .wxrow div em{display:block;font-style:normal;font-size:10px;margin-top:3px;white-space:nowrap}
  .pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;min-width:64px;text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:10px 8px;cursor:pointer;color:var(--muted);transition:.15s}
  .pill b{display:block;font-size:20px;color:var(--ink)}
  .pill small{font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .pill.on{background:var(--gold);color:#3a2a10;border-color:var(--gold);transform:scale(1.05)}
  .pill.on b{color:#3a2a10}
  .daybox{text-align:center;padding:10px 0 4px}
  .daybox .hero{font-size:72px;line-height:1;margin-bottom:8px}
  .daybox h3{font-size:24px;font-weight:800}
  .daybox .when{color:var(--muted);font-size:13px;margin:4px 0 16px}
  .slot{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.25);border-radius:18px;padding:14px;margin-top:10px;text-align:left}
  .slot .ic{font-size:34px;line-height:1}
  .slot small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
  .slot b{font-size:17px}
  .tile{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .tile:first-child{border-top:0;padding-top:0}
  .tile .ic{font-size:32px;line-height:1;width:40px;text-align:center}
  .tile b{display:block;font-size:16px}
  .tile small{color:var(--muted);font-size:13px}
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .person{background:rgba(0,0,0,.25);border-radius:18px;padding:14px 6px;text-align:center}
  .person span{display:block;font-size:40px;line-height:1;margin-bottom:6px}
  .person b{font-size:15px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:2;background:rgba(11,26,48,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:6px 10px;border-radius:14px;cursor:pointer;font-weight:700}
  nav button span{display:block;font-size:22px;margin-bottom:2px}
  nav button.on{color:var(--gold);background:rgba(255,210,138,.15)}
  section{display:none}section.on{display:block}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
  .err{color:var(--pink);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="aurora"></div><div class="snow" id="snow"></div>
<div class="wrap">
  <header><div class="big">🎅</div><h1 id="title">Lapland 2026</h1><p id="sub"></p></header>
  <div id="loading" class="loading">Warming up the sleigh...</div>
  <section id="s-home">
    <div class="card"><h2>Countdown</h2>
      <div class="cd"><div><b id="cd-d">0</b><span>days</span></div><div><b id="cd-h">00</b><span>hrs</span></div><div><b id="cd-m">00</b><span>min</span></div><div><b id="cd-s">00</b><span>sec</span></div></div>
      <div class="cd-sub" id="cd-text"></div>
    </div>
    <div class="card"><h2>Rovaniemi right now</h2><div id="wx"></div></div>
  </section>
  <section id="s-plan">
    <div class="card"><h2>Pick a day</h2><div class="pills" id="pills"></div><div class="daybox" id="daybox"></div></div>
  </section>
  <section id="s-fun">
    <div class="card"><h2>Adventures</h2><div id="act"></div></div>
    <div class="card"><h2>Food</h2><div id="rest"></div></div>
  </section>
  <section id="s-info">
    <div class="card"><h2>The crew</h2><div class="people" id="ppl"></div></div>
    <div class="card"><h2>Flights</h2><div id="fl"></div></div>
  </section>
</div>
<nav>
  <button data-s="home" class="on"><span>🏠</span>Home</button>
  <button data-s="plan"><span>🗓️</span>Days</button>
  <button data-s="fun"><span>🛷</span>Fun</button>
  <button data-s="info"><span>✈️</span>Info</button>
</nav>
<script>
var SHEET_ID='12TUnXwDfi8mp9h7RaELIEEwlVsU7y7j4XX243rcdgRk';
var WX={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Cloudy','☁️'],45:['Foggy','🌫️'],48:['Foggy','🌫️'],51:['Drizzle','🌧️'],53:['Drizzle','🌧️'],55:['Drizzle','🌧️'],56:['Icy drizzle','🌧️'],57:['Icy drizzle','🌧️'],61:['Rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Icy rain','🌧️'],67:['Icy rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow','❄️'],80:['Showers','🌧️'],81:['Showers','🌧️'],82:['Showers','🌧️'],85:['Snow showers','🌨️'],86:['Snow showers','❄️'],95:['Thunder','⛈️'],96:['Thunder','⛈️'],99:['Thunder','⛈️']};
var ICONS=[['snowmobile','🛷'],['husky','🐕'],['reindeer','🦌'],['santa','🎅'],['northern','🌌'],['aurora','🌌'],['fireplace','🔥'],['farewell','🥂'],['dinner','🍽️'],['lunch','🥪'],['sky kitchen','🌃'],['arrival','🧳'],['breakfast','☕'],['flight','✈️'],['ranua','🫎'],['moose','🫎'],['city','🏙️'],['grocery','🛒']];
var SHORT=[['snowmobile','Snowmobile safari'],['husky','Husky safari'],['reindeer','Reindeer sleigh + Sami'],['santa claus village','Santa + Rovaniemi'],['northern lights','Northern Lights hunt'],['fireplace','Fireplace night'],['farewell','Farewell dinner'],['sky kitchen','Sky Kitchen dinner'],['arrival','Arrival + settle in'],['cozy dinner','Cozy dinner in'],['breakfast','Pack + fly home'],['return flight','Fly home']];
var WOMEN=['iandra','herma','dana'];function face(n){return WOMEN.indexOf((n||'').toLowerCase().trim())>-1?'🤶':'🎅';}
function icon(s){s=(s||'').toLowerCase();for(var i=0;i<ICONS.length;i++)if(s.indexOf(ICONS[i][0])>-1)return ICONS[i][1];return '✨';}
function short(s){var l=(s||'').toLowerCase();for(var i=0;i<SHORT.length;i++)if(l.indexOf(SHORT[i][0])>-1)return SHORT[i][1];return (s||'').split(/[,(]/)[0].trim();}
function wx(c){return WX[c]||['','🌡️'];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function iso(s){s=String(s||'').trim();var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return s;}
function fmt(d,o){return new Date(iso(d)+'T00:00:00').toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});}
function pad(n){return (n<10?'0':'')+n;}
function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c=='"')q=true;else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!='\r')f+=c;}}if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}
function cachedFetch(url,key){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(t){try{localStorage.setItem(key,t);}catch(e){}return t;}).catch(function(e){var c=null;try{c=localStorage.getItem(key);}catch(x){}if(c)return c;throw e;});}
function readTab(name){return cachedFetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name)+'&_='+Date.now(),'tab_'+name).then(function(t){var rows=parseCSV(t);if(rows.length<2)return [];var h=rows[0];return rows.slice(1).filter(function(r){return r.join('')!=='';}).map(function(r){var o={};h.forEach(function(k,i){o[k.trim()]=(r[i]||'').trim();});return o;});});}
function loadWeather(cfg){var lat=String(cfg.accommodation_lat||cfg.weather_lat||'66.5039').replace(',','.'),lon=String(cfg.accommodation_lon||cfg.weather_lon||'25.7294').replace(',','.');
  return cachedFetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,snowfall_sum,daylight_duration&timezone=Europe%2FHelsinki&forecast_days=14','wx').then(function(t){return JSON.parse(t);}).catch(function(e){return {error:String(e)};});}
// Snow
(function(){var h='';for(var i=0;i<28;i++){h+='<i style="left:'+Math.random()*100+'%;font-size:'+(8+Math.random()*14)+'px;animation-duration:'+(8+Math.random()*12)+'s;animation-delay:-'+(Math.random()*20)+'s">❄</i>';}document.getElementById('snow').innerHTML=h;})();
var target=null;
function tick(){if(!target)return;var diff=Math.max(0,target-Date.now());var s=Math.floor(diff/1000);document.getElementById('cd-d').textContent=Math.floor(s/86400);document.getElementById('cd-h').textContent=pad(Math.floor(s%86400/3600));document.getElementById('cd-m').textContent=pad(Math.floor(s%3600/60));document.getElementById('cd-s').textContent=pad(s%60);if(diff===0)document.getElementById('cd-text').textContent='We are off! 🎉';}
function render(D){
  var c=D.config;
  document.getElementById('loading').style.display='none';
  document.getElementById('title').textContent=c.trip_name||'Lapland 2026';
  var start=iso(c.start_date),end=iso(c.end_date);
  document.getElementById('sub').textContent='❄️ '+fmt(start,{day:'numeric',month:'short'})+' to '+fmt(end,{day:'numeric',month:'short'})+' · '+(c.destination||'Rovaniemi');
  var tgt=c.countdown_target&&!isNaN(new Date(c.countdown_target).getTime())?new Date(c.countdown_target):new Date(start+'T12:20:00+01:00');
  target=tgt.getTime();
  document.getElementById('cd-text').textContent='until we fly ✈️ '+tgt.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  tick();setInterval(tick,1000);
  // Weather
  var w=D.weather,el=document.getElementById('wx');
  if(!w||w.error||!w.current){el.innerHTML='<div class="err">Weather is hiding behind a cloud ☁️</div>';}
  else{var cw=wx(w.current.weather_code);
    var h='<div class="wx"><div class="ic">'+cw[1]+'</div><div><div class="t">'+Math.round(w.current.temperature_2m)+'°</div><div class="d">'+cw[0]+'</div></div></div><div class="wxrow">';
    var dl=w.daily,shown=0;
    for(var i=0;i<dl.time.length&&shown<6;i++){var d=dl.time[i];var trip=d>=start&&d<=end;if(i<7||trip){var sn=dl.snowfall_sum?dl.snowfall_sum[i]:0,dh=dl.daylight_duration?Math.round(dl.daylight_duration[i]/360)/10:null;h+='<div class="'+(trip?'trip':'')+'">'+fmt(d,{weekday:'short'})+'<span>'+wx(dl.weather_code[i])[1]+'</span><b>'+Math.round(dl.temperature_2m_max[i])+'°</b><em>'+(sn>0?'❄ '+sn+' cm':'❄ 0')+'</em><em>☀ '+(dh!==null?dh+' h':'?')+'</em></div>';shown++;}}
    el.innerHTML=h+'</div>';}
  // Days
  var days=D.itinerary.map(function(r){r.date=iso(r.date);return r;}).sort(function(a,b){return a.date<b.date?-1:1;});
  var today=new Date().toISOString().slice(0,10),sel=0;
  days.forEach(function(d,i){if(d.date===today)sel=i;});
  var pills=document.getElementById('pills');
  pills.innerHTML=days.map(function(d,i){return '<div class="pill" data-i="'+i+'"><small>'+fmt(d.date,{weekday:'short'})+'</small><b>'+fmt(d.date,{day:'numeric'})+'</b><small>'+icon(d.daytime)+'</small></div>';}).join('');
  function showDay(i){sel=i;pills.querySelectorAll('.pill').forEach(function(p,j){p.classList.toggle('on',j===i);});var d=days[i];
    document.getElementById('daybox').innerHTML='<div class="hero">'+icon(d.daytime)+'</div><h3>'+esc(short(d.daytime))+'</h3><div class="when">'+fmt(d.date,{weekday:'long',day:'numeric',month:'long'})+'</div>'
      +'<div class="slot"><div class="ic">'+icon(d.daytime)+'</div><div><small>Day</small><b>'+esc(short(d.daytime))+'</b></div></div>'
      +(d.evening&&d.evening!=='-'?'<div class="slot"><div class="ic">'+icon(d.evening)+'</div><div><small>Evening</small><b>'+esc(short(d.evening))+'</b></div></div>':'');
    pills.children[i]&&pills.children[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
  pills.querySelectorAll('.pill').forEach(function(p){p.addEventListener('click',function(){showDay(+p.dataset.i);});});
  showDay(sel);
  // Fun
  var seen={},acts=D.activities.filter(function(a){return a.date;}).map(function(a){a.date=iso(a.date);a.name=short(a.activity.split(',')[0]);return a;}).filter(function(a){if(seen[a.name])return false;seen[a.name]=1;return true;}).sort(function(a,b){return a.date<b.date?-1:1;});
  document.getElementById('act').innerHTML=acts.map(function(a){return '<div class="tile"><div class="ic">'+icon(a.name)+'</div><div><b>'+esc(a.name)+'</b><small>'+fmt(a.date,{weekday:'long'})+(a.time_of_day?' '+esc(a.time_of_day):'')+'</small></div></div>';}).join('');
  var rest=D.restaurants.filter(function(r){return r.planned_date&&!/option/i.test(r.status||'');}).map(function(r){r.planned_date=iso(r.planned_date);return r;}).sort(function(a,b){return a.planned_date<b.planned_date?-1:1;});
  var food=rest.map(function(r){var m=(r.moment||'').toLowerCase();return {d:r.planned_date,ic:(m.indexOf('lunch')>-1?'🥪':'🍽️'),t:r.restaurant,s:fmt(r.planned_date,{weekday:'long'})+' '+(m.indexOf('lunch')>-1?'lunch':'dinner')};});
  days.forEach(function(d){if(/farewell/i.test(d.evening||'')&&!food.some(function(f){return f.d===d.date;}))food.push({d:d.date,ic:'🥂',t:'Farewell dinner',s:fmt(d.date,{weekday:'long'})+' · restaurant to be chosen'});});
  food.sort(function(a,b){return a.d<b.d?-1:1;});
  document.getElementById('rest').innerHTML=food.map(function(f){return '<div class="tile"><div class="ic">'+f.ic+'</div><div><b>'+esc(f.t)+'</b><small>'+f.s+'</small></div></div>';}).join('');
  // Info
  document.getElementById('ppl').innerHTML=D.travellers.map(function(p,i){return '<div class="person"><span>'+face(p.name)+'</span><b>'+esc(p.name)+'</b></div>';}).join('');
  document.getElementById('fl').innerHTML=D.flights.filter(function(f){return /outbound|return/i.test(f.direction);}).map(function(f){var out=/outbound/i.test(f.direction);return '<div class="tile"><div class="ic">'+(out?'🛫':'🛬')+'</div><div><b>'+esc(f.from)+' → '+esc(f.to)+'</b><small>'+fmt(f.date,{weekday:'long',day:'numeric',month:'long'})+(f.departure?' · '+esc(f.departure):'')+(f.airline?' · '+esc(f.airline):'')+'</small></div></div>';}).join('');
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');document.querySelectorAll('section').forEach(function(s){s.classList.remove('on');});document.getElementById('s-'+b.dataset.s).classList.add('on');window.scrollTo(0,0);});});
document.getElementById('s-home').classList.add('on');
Promise.all(['Config','Itinerary','Travellers','Flights','Activities','Restaurants'].map(readTab)).then(function(t){
  var cfg={};t[0].forEach(function(r){cfg[r.key]=r.value;});
  return loadWeather(cfg).then(function(w){render({config:cfg,itinerary:t[1],travellers:t[2],flights:t[3],activities:t[4],restaurants:t[5],weather:w});});
}).catch(function(e){document.getElementById('loading').innerHTML='<span class="err">Oops, could not load the plan: '+esc(e.message)+'</span>';});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>

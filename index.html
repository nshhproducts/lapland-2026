<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lapland 2026">
<meta name="theme-color" content="#0E1B2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,100&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Lapland 2026</title>
<style>
  :root{--night:#0E1B2E;--night2:#0A1424;--teal:#123C4A;--aurora:#6EF3B5;--gold:#F2C078;--snow:#F6F3EC;--snow2:rgba(246,243,236,.62);--line:rgba(246,243,236,.12);--ink-on-gold:#2A1E0A;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--night)}
  body{background:var(--night);color:var(--snow);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + var(--sab));overflow-x:hidden}
  .display{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"opsz" 144;font-weight:600;letter-spacing:-.02em}
  a{color:inherit}
  button{font:inherit;color:inherit}

  /* hero */
  .hero{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:calc(104px + var(--sat)) 24px 6px;isolation:isolate}
  .hero #stars{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
  .hero #aurora{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);z-index:-1;filter:blur(14px) saturate(1.1);opacity:.75}
  .hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(14,27,46,0) 0%,rgba(14,27,46,.85) 60%,var(--night) 100%);z-index:-1}
  .hero .eyebrow{color:var(--snow2);font-weight:700;font-size:14px}
  .hero .num{font-size:clamp(96px,30vw,150px);line-height:.9;color:var(--snow);margin:6px 0 2px}
  .hero .num small{font-size:.26em;font-weight:500;letter-spacing:0;color:var(--gold);margin-left:8px;font-variation-settings:"SOFT" 100,"opsz" 24}
  .hero .sub{font-size:15px;color:var(--snow2)}
  .hero .clock{display:inline-flex;gap:14px;margin-top:14px;font-variant-numeric:tabular-nums;color:var(--snow)}
  .hero .clock b{font-weight:800;font-size:20px}
  .hero .clock span{display:block;font-size:11px;color:var(--snow2);font-weight:700}
  .hero .top{position:absolute;top:calc(40px + var(--sat));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:var(--snow2)}
  .hero .top b{color:var(--snow);font-family:Fraunces,serif;font-weight:600;font-size:18px;letter-spacing:-.01em}

  .wrap{padding:0 20px;max-width:640px;margin:0 auto}
  h2{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"opsz" 60;font-weight:600;font-size:26px;letter-spacing:-.02em;margin:28px 0 12px}
  h2 em{font-style:italic;font-weight:400;color:var(--gold)}
  .muted{color:var(--snow2)}

  /* weather */
  .wx-now{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(18,60,74,.9),rgba(14,27,46,.6));border:1px solid var(--line);border-radius:28px;padding:18px 20px}
  .wx-now .ic{font-size:54px;line-height:1}
  .wx-now .t{font-family:Fraunces,serif;font-weight:600;font-size:52px;line-height:1;letter-spacing:-.03em}
  .wx-now .d{color:var(--snow2);font-weight:700;margin-top:2px}
  .wx-now .light{grid-column:1/-1;display:flex;gap:18px;font-size:13px;color:var(--snow2);border-top:1px solid var(--line);padding-top:12px;margin-top:4px;flex-wrap:wrap}
  .wx-now .light b{color:var(--snow)}
  .wx-days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(68px,1fr);gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .wx-days::-webkit-scrollbar{display:none}
  .wx-day{text-align:center;padding:12px 6px 10px;border-radius:18px;background:rgba(246,243,236,.05);border:1px solid transparent;font-size:12px;color:var(--snow2)}
  .wx-day.trip{border-color:rgba(242,192,120,.6);background:rgba(242,192,120,.08)}
  .wx-day .i{font-size:26px;line-height:1.2;display:block;margin:4px 0 2px}
  .wx-day b{display:block;color:var(--snow);font-size:15px;font-weight:800}
  .wx-day s{display:block;text-decoration:none;font-size:11px;margin-top:3px}
  .wx-note{font-size:13px;color:var(--snow2);margin-top:10px}

  /* timeline */
  .tl{position:relative;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:10px 2px 14px}
  .tl::-webkit-scrollbar{display:none}
  .tl:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(246,243,236,.25)}
  .tl button{position:relative;flex:0 0 auto;width:74px;background:var(--night);border:1px solid var(--line);border-radius:20px;padding:10px 4px 8px;text-align:center;cursor:pointer;color:var(--snow2);transition:transform .15s,background .15s}
  .tl button .w{font-size:11px;font-weight:800;letter-spacing:.04em}
  .tl button .d{font-family:Fraunces,serif;font-weight:600;font-size:26px;line-height:1.1;color:var(--snow)}
  .tl button .e{font-size:18px;line-height:1.2}
  .tl button.on{background:var(--gold);color:var(--ink-on-gold);border-color:var(--gold);transform:translateY(-3px)}
  .tl button.on .d{color:var(--ink-on-gold)}
  .tl button:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
  .day{border-radius:28px;background:linear-gradient(160deg,rgba(18,60,74,.75),rgba(14,27,46,.4));border:1px solid var(--line);padding:22px 20px 18px;overflow:hidden;position:relative}
  .day .big{font-size:88px;line-height:1;float:right;margin:-10px -6px 0 12px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
  .day h3{font-family:Fraunces,serif;font-variation-settings:"SOFT" 100,"opsz" 60;font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin-bottom:4px}
  .day .when{color:var(--snow2);font-weight:700;font-size:14px}
  .day .tag{clear:both;margin-top:14px;font-style:italic;font-family:Fraunces,serif;font-weight:400;font-size:17px;color:var(--gold)}
  .day .slots{margin-top:16px;display:grid;gap:8px}
  .slot{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 12px;border-radius:18px;background:rgba(14,27,46,.55)}
  .slot .ic{font-size:30px;text-align:center}
  .slot small{display:block;color:var(--snow2);font-weight:700;font-size:12px}
  .slot b{font-size:17px;font-weight:800}
  .day .sun{margin-top:14px;font-size:13px;color:var(--snow2);display:flex;gap:16px;flex-wrap:wrap}
  .day .sun b{color:var(--snow)}

  /* tickets */
  .ticket{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:rgba(246,243,236,.05);border:1px solid var(--line);margin-bottom:10px;position:relative}
  .ticket:before,.ticket:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--night);top:50%;transform:translateY(-50%);border:1px solid var(--line)}
  .ticket:before{left:-10px;border-right-color:transparent}
  .ticket:after{right:-10px;border-left-color:transparent}
  .ticket .ic{font-size:40px;text-align:center;line-height:1}
  .ticket b{display:block;font-size:17px;font-weight:800}
  .ticket small{color:var(--snow2);font-weight:700;font-size:13px}
  .ticket .day-pill{position:absolute;right:16px;top:-9px;background:var(--gold);color:var(--ink-on-gold);font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}

  /* crew + flights */
  .crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .crew div{text-align:center;padding:16px 6px 12px;border-radius:22px;background:rgba(246,243,236,.05);border:1px solid var(--line)}
  .crew span{display:block;font-size:46px;line-height:1;margin-bottom:8px}
  .crew img{display:block;width:84%;max-width:110px;height:auto;aspect-ratio:1/1;object-fit:cover;margin:0 auto 10px;border-radius:50%;box-shadow:0 0 0 2px rgba(242,192,120,.55),0 10px 24px rgba(0,0,0,.35)}
  .crew b{font-weight:800}
  .pass{border-radius:24px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:rgba(246,243,236,.05)}
  .pass .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px 10px;gap:10px}
  .pass .code{font-family:Fraunces,serif;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1}
  .pass .city{font-size:12px;color:var(--snow2);font-weight:700}
  .pass .plane{font-size:22px;color:var(--gold)}
  .pass .r{text-align:right}
  .pass .foot{display:flex;justify-content:space-between;gap:10px;padding:10px 18px 14px;border-top:1px dashed rgba(246,243,236,.25);font-size:13px;color:var(--snow2);font-weight:700}
  .pass .foot b{color:var(--snow);display:block;font-size:14px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(10,20,36,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + var(--sab))}
  nav button{background:none;border:0;padding:6px 0;border-radius:14px;cursor:pointer;color:var(--snow2);font-weight:800;font-size:11px}
  nav button span{display:block;font-size:22px;line-height:1.2;margin-bottom:2px;filter:grayscale(.3);opacity:.8}
  nav button.on{color:var(--gold)}
  nav button.on span{filter:none;opacity:1}
  nav button:focus-visible{outline:2px solid var(--aurora)}
  section{display:none;animation:in .25s ease-out}section.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .loading{padding:40px 20px;text-align:center;color:var(--snow2);font-weight:700}
  .err{color:#FFB4C4;font-weight:700}
  .spacer{height:28px}
  .live-btn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:8px 14px 8px 12px;border-radius:99px;border:1px solid rgba(110,243,181,.45);background:rgba(110,243,181,.12);color:var(--aurora);font-weight:800;font-size:13px;cursor:pointer}
  .live-btn i{width:8px;height:8px;border-radius:50%;background:#FF5A6E;box-shadow:0 0 0 0 rgba(255,90,110,.6);animation:pulse 1.6s infinite;font-style:normal}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,110,.6)}70%{box-shadow:0 0 0 8px rgba(255,90,110,0)}100%{box-shadow:0 0 0 0 rgba(255,90,110,0)}}
  .ticket.live{cursor:pointer;border-color:rgba(110,243,181,.45)}
  .ticket.live small em{font-style:normal;color:var(--aurora)}
  .sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,10,20,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .panel{width:100%;max-width:640px;background:var(--night);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + var(--sab));animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
  .sheet .head b{font-family:Fraunces,serif;font-weight:600;font-size:22px;letter-spacing:-.01em}
  .sheet .head button{background:rgba(246,243,236,.1);border:0;border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer}
  .sheet .vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
  .sheet iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sheet .alt{display:block;text-align:center;margin-top:12px;font-weight:800;font-size:14px;color:var(--snow2);text-decoration:none}
  .snowfall{position:fixed;inset:0;pointer-events:none;z-index:4}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (min-width:700px){.hero .top,.hero .inner{max-width:640px;margin-left:auto;margin-right:auto;left:0;right:0}}
</style>
</head>
<body>
<canvas class="snowfall" id="snowfall" aria-hidden="true"></canvas>
<section id="s-home" class="on">
  <div class="hero">
    <canvas id="aurora" aria-hidden="true"></canvas><canvas id="stars" aria-hidden="true"></canvas>
    <div class="top"><b>Lapland 2026</b><span id="dates"></span></div>
    <div class="inner">
      <div class="eyebrow" id="eyebrow">Until we fly to Rovaniemi</div>
      <div class="num display"><span id="cd-d">–</span><small id="cd-unit">days</small></div>
      <div class="sub" id="cd-text"></div>
      <div class="clock"><div><b id="cd-h">00</b><span>hours</span></div><div><b id="cd-m">00</b><span>minutes</span></div><div><b id="cd-s">00</b><span>seconds</span></div></div>
    </div>
  </div>
  <div class="wrap">
    <h2 style="margin-top:22px">Rovaniemi <em>right now</em></h2>
    <div id="wx" class="loading">Reading the sky...</div>
    <div class="spacer"></div>
  </div>
</section>

<section id="s-plan">
  <div class="wrap">
    <h2 style="margin-top:calc(28px + var(--sat))">Six days, <em>one adventure</em></h2>
    <div class="tl" id="tl"></div>
    <div class="day" id="daybox"></div>
    <div class="spacer"></div>
  </div>
</section>

<section id="s-fun">
  <div class="wrap">
    <h2 style="margin-top:calc(28px + var(--sat))">Your <em>tickets</em></h2>
    <div id="act"></div>
    <h2>Table <em>reserved</em></h2>
    <div id="rest"></div>
    <div class="spacer"></div>
  </div>
</section>

<section id="s-info">
  <div class="wrap">
    <h2 style="margin-top:calc(28px + var(--sat))">The <em>crew</em></h2>
    <div class="crew" id="ppl"></div>
    <h2>Boarding <em>passes</em></h2>
    <div id="fl"></div>
    <div class="spacer"></div>
  </div>
</section>

<div class="sheet" id="live" role="dialog" aria-modal="true" aria-label="Northern Lights live">
  <div class="panel">
    <div class="head"><b>Aurora sky, live from Rovaniemi</b><button type="button" id="live-close" aria-label="Close">✕</button></div>
    <div class="vid" id="live-vid"></div>
    <a class="alt" id="live-yt" href="#" target="_blank" rel="noopener">Not playing? Open in YouTube</a>
  </div>
</div>
<div id="loading" class="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--night);z-index:9">Warming up the sleigh...</div>

<nav>
  <button data-s="home" class="on"><span>🏔️</span>Home</button>
  <button data-s="plan"><span>🗓️</span>Days</button>
  <button data-s="fun"><span>🎟️</span>Fun</button>
  <button data-s="info"><span>✈️</span>Crew</button>
</nav>

<script>
var SHEET_ID='12TUnXwDfi8mp9h7RaELIEEwlVsU7y7j4XX243rcdgRk';
var LAT=66.5039,LON=25.7294;
var WX={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Cloudy','☁️'],45:['Foggy','🌫️'],48:['Freezing fog','🌫️'],51:['Drizzle','🌧️'],53:['Drizzle','🌧️'],55:['Drizzle','🌧️'],56:['Icy drizzle','🌧️'],57:['Icy drizzle','🌧️'],61:['Rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Icy rain','🌧️'],67:['Icy rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow','❄️'],80:['Showers','🌧️'],81:['Showers','🌧️'],82:['Showers','🌧️'],85:['Snow showers','🌨️'],86:['Snow showers','❄️'],95:['Thunder','⛈️'],96:['Thunder','⛈️'],99:['Thunder','⛈️']};
var ICONS=[['snowmobile','🛷'],['husky','🐕'],['reindeer','🦌'],['santa','🎅'],['northern','🌌'],['aurora','🌌'],['fireplace','🔥'],['farewell','🥂'],['sky kitchen','🌃'],['dinner','🍽️'],['lunch','🥪'],['arrival','🧳'],['breakfast','☕'],['flight','✈️'],['moose','🫎'],['city','🏙️']];
var SHORT=[['snowmobile','Snowmobile safari'],['husky','Husky safari'],['reindeer','Reindeer sleigh & Sami'],['santa claus village','Santa & Rovaniemi'],['northern lights','Northern Lights hunt'],['fireplace','Fireplace night'],['farewell','Farewell dinner'],['sky kitchen','Sky Kitchen dinner'],['arrival','Arrival & settle in'],['cozy dinner','Cozy dinner in'],['breakfast','Pack & fly home'],['return flight','Fly home']];
var TAG=[['snowmobile','Full throttle across frozen lakes.'],['husky','Six paws per sled, zero brakes.'],['reindeer','Slow miles, old stories.'],['santa','The man himself. Bring your list.'],['arrival','Keys, groceries, first snow.'],['breakfast','One last look at the white.']];
var WOMEN=['iandra','herma','dana'];
function face(n){return WOMEN.indexOf((n||'').toLowerCase().trim())>-1?'🤶':'🎅';}
function pick(list,s,dflt){s=(s||'').toLowerCase();for(var i=0;i<list.length;i++)if(s.indexOf(list[i][0])>-1)return list[i][1];return dflt;}
function icon(s){return pick(ICONS,s,'✨');}
function short(s){return pick(SHORT,s,null)||(s||'').split(/[,(]/)[0].trim();}
function tag(s){return pick(TAG,s,'');}
function wx(c){return WX[c]||['','🌡️'];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function iso(s){s=String(s||'').trim();var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return s;}
function fmt(d,o){return new Date(iso(d)+'T00:00:00').toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});}
function hm(t){var m=String(t||'').match(/T(\d{2}:\d{2})/);return m?m[1]:'';}
function pad(n){return (n<10?'0':'')+n;}
function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c=='"')q=true;else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!='\r')f+=c;}}if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}
function cachedFetch(url,key){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(t){try{localStorage.setItem(key,t);}catch(e){}return t;}).catch(function(e){var c=null;try{c=localStorage.getItem(key);}catch(x){}if(c)return c;throw e;});}
function readTab(name){return cachedFetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name)+'&_='+Date.now(),'tab_'+name).then(function(t){var rows=parseCSV(t);if(rows.length<2)return [];var h=rows[0];return rows.slice(1).filter(function(r){return r.join('')!=='';}).map(function(r){var o={};h.forEach(function(k,i){o[k.trim()]=(r[i]||'').trim();});return o;});});}
function loadWeather(cfg){var lat=String(cfg.accommodation_lat||cfg.weather_lat||LAT).replace(',','.'),lon=String(cfg.accommodation_lon||cfg.weather_lon||LON).replace(',','.');
  return cachedFetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,snowfall_sum,daylight_duration,sunrise,sunset&timezone=Europe%2FHelsinki&forecast_days=16','wx').then(function(t){return JSON.parse(t);}).catch(function(e){return {error:String(e)};});}
// Sunrise/sunset for trip days (NOAA-style approximation, good to a few minutes)
function sunTimes(dateIso,lat,lon){var d=new Date(dateIso+'T12:00:00Z');var n=Math.floor((d-Date.UTC(2000,0,1,12))/864e5);var J=n+0.0009-lon/360;var M=(357.5291+0.98560028*J)%360,Mr=M*Math.PI/180;var C=1.9148*Math.sin(Mr)+0.02*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);var L=(M+C+180+102.9372)%360,Lr=L*Math.PI/180;var Jt=J+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*Lr);var dec=Math.asin(Math.sin(Lr)*Math.sin(23.44*Math.PI/180));var phi=lat*Math.PI/180;var cosw=(Math.sin(-0.833*Math.PI/180)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));if(cosw>1)return null;if(cosw<-1)return {all:true};var w=Math.acos(cosw)*180/Math.PI/360;var rise=Jt-w,set=Jt+w;function toHM(j){var ms=Date.UTC(2000,0,1,12)+j*864e5;return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Helsinki'});}return {rise:toHM(rise),set:toHM(set),hours:Math.round(w*2*24*10)/10};}

// Aurora canvas
(function(){var c=document.getElementById('aurora'),ctx=c.getContext('2d'),sc=document.getElementById('stars'),sctx=sc.getContext('2d'),SW,SH,W,H,t=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=c.width=c.clientWidth*devicePixelRatio;H=c.height=c.clientHeight*devicePixelRatio;SW=sc.width=sc.clientWidth*devicePixelRatio;SH=sc.height=sc.clientHeight*devicePixelRatio;}size();addEventListener('resize',size);
  var stars=[];for(var i=0;i<90;i++)stars.push([Math.random(),Math.random()*0.7,Math.random()*1.4+0.4,Math.random()*6.28]);
  function band(y0,amp,hue,alpha,speed,phase){ctx.beginPath();for(var x=0;x<=W;x+=W/40){var y=y0+Math.sin(x/W*4+t*speed+phase)*amp+Math.sin(x/W*9-t*speed*1.3)*amp*0.4;ctx.lineTo(x,y);}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();var g=ctx.createLinearGradient(0,y0-amp,0,y0+amp*3);g.addColorStop(0,'hsla('+hue+',85%,65%,0)');g.addColorStop(0.35,'hsla('+hue+',85%,62%,'+alpha+')');g.addColorStop(1,'hsla('+hue+',85%,55%,0)');ctx.fillStyle=g;ctx.fill();}
  function draw(){ctx.clearRect(0,0,W,H);var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071022');g.addColorStop(1,'#0E1B2E');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    sctx.clearRect(0,0,SW,SH);sctx.fillStyle='#F6F3EC';stars.forEach(function(s){var a=0.35+0.45*Math.abs(Math.sin(t*0.6+s[3]));sctx.globalAlpha=a;sctx.beginPath();sctx.arc(s[0]*SW,s[1]*SH,s[2]*devicePixelRatio*0.7,0,6.28);sctx.fill();});sctx.globalAlpha=1;
    ctx.globalCompositeOperation='lighter';band(H*0.40,H*0.07,155,0.42,0.5,0);band(H*0.50,H*0.08,170,0.26,0.35,2);band(H*0.32,H*0.05,300,0.16,0.42,4);ctx.globalCompositeOperation='source-over';
    if(!reduce){t+=0.008;requestAnimationFrame(draw);}}
  draw();})();

// Snowfall
(function(){var c=document.getElementById('snowfall');if(!c)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){c.remove();return;}
  var ctx=c.getContext('2d'),W,H,flakes=[],N=90;
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;}size();addEventListener('resize',size);
  function mk(top){var r=(Math.random()*2.2+0.8)*devicePixelRatio;return {x:Math.random()*W,y:top?-10:Math.random()*H,r:r,v:(0.35+r/devicePixelRatio*0.28)*devicePixelRatio,d:Math.random()*6.28,s:(Math.random()*0.5+0.2)*devicePixelRatio,a:0.35+Math.random()*0.5};}
  for(var i=0;i<N;i++)flakes.push(mk(false));
  var t=0;function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#F6F3EC';t+=0.01;
    for(var i=0;i<N;i++){var f=flakes[i];f.y+=f.v;f.x+=Math.sin(t*2+f.d)*f.s;if(f.y>H+10||f.x<-10||f.x>W+10)flakes[i]=mk(true);ctx.globalAlpha=f.a;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;requestAnimationFrame(draw);}
  var hidden=false;document.addEventListener('visibilitychange',function(){hidden=document.hidden;});draw();})();
var LIVE_URL='https://www.youtube.com/live/ccTVAhJU5lg';
function ytId(u){var m=String(u||'').match(/(?:live\/|v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:null;}
function openLive(){var id=ytId(LIVE_URL);var box=document.getElementById('live-vid');document.getElementById('live-yt').href=LIVE_URL;
  box.innerHTML=id?'<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Northern Lights live"></iframe>':'';
  document.getElementById('live').classList.add('on');}
function closeLive(){document.getElementById('live').classList.remove('on');document.getElementById('live-vid').innerHTML='';}
document.getElementById('live-close').addEventListener('click',closeLive);
document.getElementById('live').addEventListener('click',function(e){if(e.target.id==='live')closeLive();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLive();});
function isAurora(s){return /northern|aurora/i.test(s||'');}
var target=null;
function tick(){if(!target)return;var diff=Math.max(0,target-Date.now());var s=Math.floor(diff/1000);var d=Math.floor(s/86400);document.getElementById('cd-d').textContent=d;document.getElementById('cd-unit').textContent=d===1?'day':'days';document.getElementById('cd-h').textContent=pad(Math.floor(s%86400/3600));document.getElementById('cd-m').textContent=pad(Math.floor(s%3600/60));document.getElementById('cd-s').textContent=pad(s%60);if(diff===0){document.getElementById('eyebrow').textContent='We are on our way';document.getElementById('cd-text').textContent='Have the best trip 🎉';}}

function render(D){
  var c=D.config,start=iso(c.start_date),end=iso(c.end_date);
  if(c.aurora_live_url)LIVE_URL=c.aurora_live_url;
  document.getElementById('loading').style.display='none';
  document.getElementById('dates').textContent=fmt(start,{day:'numeric',month:'short'})+' to '+fmt(end,{day:'numeric',month:'short'});
  var tgt=c.countdown_target&&!isNaN(new Date(c.countdown_target).getTime())?new Date(c.countdown_target):new Date(start+'T12:20:00+01:00');
  target=tgt.getTime();
  document.getElementById('cd-text').textContent='Wheels up '+tgt.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' at '+tgt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' from Schiphol';
  tick();setInterval(tick,1000);

  // Weather
  var w=D.weather,el=document.getElementById('wx');el.className='';
  if(!w||w.error||!w.current){el.innerHTML='<div class="err">The sky is not answering right now. Pull down to try again.</div>';}
  else{var cur=w.current,cw=wx(cur.weather_code),dl=w.daily,i0=0;
    var h='<div class="wx-now"><div class="ic">'+cw[1]+'</div><div><div class="t">'+Math.round(cur.temperature_2m)+'°</div><div class="d">'+cw[0]+' · feels like '+Math.round(cur.apparent_temperature)+'°</div></div>';
    h+='<div class="light"><span>Sunrise <b>'+hm(dl.sunrise[i0])+'</b></span><span>Sunset <b>'+hm(dl.sunset[i0])+'</b></span><span>Daylight <b>'+(Math.round(dl.daylight_duration[i0]/360)/10)+' h</b></span><span>Wind <b>'+Math.round(cur.wind_speed_10m)+' km/h</b></span></div></div>';
    var inRange=dl.time.indexOf(start)>-1;
    h+='<div class="wx-days">';var shown=0;
    for(var i=0;i<dl.time.length;i++){var d=dl.time[i],trip=d>=start&&d<=end;if(inRange?trip:(i<7)){h+='<div class="wx-day'+(trip?' trip':'')+'">'+fmt(d,{weekday:'short'})+'<span class="i">'+wx(dl.weather_code[i])[1]+'</span><b>'+Math.round(dl.temperature_2m_max[i])+'°</b><s>❄ '+(dl.snowfall_sum[i]||0)+' cm</s><s>☀ '+(Math.round(dl.daylight_duration[i]/360)/10)+' h</s></div>';shown++;}}
    h+='</div>';
    var daysTo=Math.ceil((new Date(start)-new Date(dl.time[0]))/864e5)-15;
    h+='<div class="wx-note">'+(inRange?'Trip days are outlined in gold.':'Trip-day forecast appears '+(daysTo>0?'in '+daysTo+' days':'soon')+'. Until then: in mid-December Rovaniemi gets about 3 hours of twilight, sun below the horizon all day.')+'</div>';
    el.innerHTML=h;}

  // Days
  var days=D.itinerary.map(function(r){r.date=iso(r.date);return r;}).sort(function(a,b){return a.date<b.date?-1:1;});
  var today=new Date().toISOString().slice(0,10),sel=0;days.forEach(function(d,i){if(d.date===today)sel=i;});
  var tl=document.getElementById('tl');
  tl.innerHTML=days.map(function(d,i){return '<button data-i="'+i+'"><div class="w">'+fmt(d.date,{weekday:'short'}).toUpperCase()+'</div><div class="d">'+fmt(d.date,{day:'numeric'})+'</div><div class="e">'+icon(d.daytime)+'</div></button>';}).join('');
  function showDay(i){sel=i;var btns=tl.querySelectorAll('button');btns.forEach(function(b,j){b.classList.toggle('on',j===i);});var d=days[i];var sun=sunTimes(d.date,LAT,LON);
    var sunHtml=sun===null?'<span>Polar night: the sun stays below the horizon, twilight roughly <b>10:00 to 14:00</b></span>':sun.all?'':'<span>Sunrise <b>'+sun.rise+'</b></span><span>Sunset <b>'+sun.set+'</b></span><span>Daylight <b>'+sun.hours+' h</b></span>';
    document.getElementById('daybox').innerHTML='<div class="big">'+icon(d.daytime)+'</div><h3>'+esc(short(d.daytime))+'</h3><div class="when">'+fmt(d.date,{weekday:'long',day:'numeric',month:'long'})+'</div>'
      +(tag(d.daytime)?'<div class="tag">'+esc(tag(d.daytime))+'</div>':'')
      +'<div class="slots"><div class="slot"><div class="ic">'+icon(d.daytime)+'</div><div><small>Daytime</small><b>'+esc(short(d.daytime))+'</b></div></div>'
      +(d.evening&&d.evening!=='-'?'<div class="slot"><div class="ic">'+icon(d.evening)+'</div><div><small>Evening'+(d.start_time?' · '+esc(d.start_time):'')+'</small><b>'+esc(short(d.evening))+'</b>'+(isAurora(d.evening)?'<br><button type="button" class="live-btn" data-live><i></i>Watch the sky live</button>':'')+'</div></div>':'')+'</div>'
      +'<div class="sun">'+sunHtml+'</div>';
    var lb=document.querySelector('#daybox [data-live]');if(lb)lb.addEventListener('click',openLive);
    btns[i]&&btns[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
  tl.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){showDay(+b.dataset.i);});});
  showDay(sel);
  var sx=null;document.getElementById('daybox').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  document.getElementById('daybox').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(dx<-50&&sel<days.length-1)showDay(sel+1);else if(dx>50&&sel>0)showDay(sel-1);},{passive:true});

  // Tickets
  var seen={},acts=D.activities.filter(function(a){return a.date;}).map(function(a){a.date=iso(a.date);a.name=short(a.activity.split(',')[0]);return a;}).filter(function(a){if(seen[a.name])return false;seen[a.name]=1;return true;}).sort(function(a,b){return a.date<b.date?-1:1;});
  document.getElementById('act').innerHTML=acts.map(function(a){var lv=isAurora(a.name);return '<div class="ticket'+(lv?' live':'')+'"'+(lv?' role="button" tabindex="0" data-live':'')+'><div class="day-pill">'+fmt(a.date,{weekday:'short'})+'</div><div class="ic">'+icon(a.name)+'</div><div><b>'+esc(a.name)+'</b><small>'+fmt(a.date,{weekday:'long'})+(a.time_of_day?', '+esc(a.time_of_day):'')+(lv?' · <em>● Tap to watch the sky live</em>':(tag(a.name)?' · '+esc(tag(a.name)):''))+'</small></div></div>';}).join('');
  document.querySelectorAll('#act [data-live]').forEach(function(el){el.addEventListener('click',openLive);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLive();}});});
  var rest=D.restaurants.filter(function(r){return r.planned_date&&!/option/i.test(r.status||'');}).map(function(r){var m=(r.moment||'').toLowerCase();return {d:iso(r.planned_date),ic:m.indexOf('lunch')>-1?'🥪':'🍽️',t:r.restaurant,s:fmt(iso(r.planned_date),{weekday:'long'})+' '+(m.indexOf('lunch')>-1?'lunch':'dinner')};});
  days.forEach(function(d){if(/farewell/i.test(d.evening||'')&&!rest.some(function(f){return f.d===d.date;}))rest.push({d:d.date,ic:'🥂',t:'Farewell dinner',s:fmt(d.date,{weekday:'long'})+' · restaurant still to pick'});});
  rest.sort(function(a,b){return a.d<b.d?-1:1;});
  document.getElementById('rest').innerHTML=rest.map(function(f){return '<div class="ticket"><div class="day-pill">'+fmt(f.d,{weekday:'short'})+'</div><div class="ic">'+f.ic+'</div><div><b>'+esc(f.t)+'</b><small>'+f.s+'</small></div></div>';}).join('');

  // Crew + passes
  var PHOTOS=['nick','iandra','herma','marco','kevin','dana'];
  document.getElementById('ppl').innerHTML=D.travellers.map(function(p){var k=(p.name||'').toLowerCase().trim();var av=PHOTOS.indexOf(k)>-1?'<img src="crew/'+k+'.webp" alt="'+esc(p.name)+'" loading="lazy" width="256" height="256">':'<span>'+face(p.name)+'</span>';return '<div>'+av+'<b>'+esc(p.name)+'</b></div>';}).join('');
  function code(s){s=(s||'').toLowerCase();if(s.indexOf('schiphol')>-1||s.indexOf('amsterdam')>-1)return ['AMS','Amsterdam'];if(s.indexOf('rovaniemi')>-1)return ['RVN','Rovaniemi'];return [s.slice(0,3).toUpperCase(),s];}
  document.getElementById('fl').innerHTML=D.flights.filter(function(f){return /outbound|return/i.test(f.direction);}).map(function(f){var a=code(f.from),b=code(f.to);return '<div class="pass"><div class="row"><div><div class="code">'+a[0]+'</div><div class="city">'+esc(a[1])+'</div></div><div class="plane">✈</div><div class="r"><div class="code">'+b[0]+'</div><div class="city">'+esc(b[1])+'</div></div></div><div class="foot"><span>Date<b>'+fmt(f.date,{weekday:'short',day:'numeric',month:'short'})+'</b></span><span>Departs<b>'+esc(f.departure||'tbc')+'</b></span><span>Airline<b>'+esc(f.airline||'')+'</b></span><span>Bags<b>'+(f.baggage?'23 kg + cabin':'')+'</b></span></div></div>';}).join('');
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');document.querySelectorAll('section').forEach(function(s){s.classList.remove('on');});document.getElementById('s-'+b.dataset.s).classList.add('on');window.scrollTo(0,0);});});
Promise.all(['Config','Itinerary','Travellers','Flights','Activities','Restaurants'].map(readTab)).then(function(t){
  var cfg={};t[0].forEach(function(r){cfg[r.key]=r.value;});
  return loadWeather(cfg).then(function(w){render({config:cfg,itinerary:t[1],travellers:t[2],flights:t[3],activities:t[4],restaurants:t[5],weather:w});});
}).catch(function(e){document.getElementById('loading').innerHTML='<span class="err">Could not load the plan: '+esc(e.message)+'. Check your connection and reload.</span>';});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
